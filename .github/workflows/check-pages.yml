name: Verify Pages source
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source-lengkap/package-lock.json
      - run: npm --prefix source-lengkap ci
      - run: npm run check:pages
      - run: npm run test:preview
